name: Image Build PR check

on: [push, pull_request]

jobs:
  image-build:
    runs-on: ubuntu-22.04
    steps:
    - name: Clone source code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: image-build
      run: |
        docker pull quay.io/eclipse/che-plugin-registry:next
        BUILDER=docker ./build.sh --tag pr-check
